version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medscribe-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medscribe}
      POSTGRES_USER: ${POSTGRES_USER:-medscribe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medscribe_user} -d ${POSTGRES_DB:-medscribe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medscribe-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medscribe-backend
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medscribe_user}:${POSTGRES_PASSWORD:-change_this_password}@postgres:5432/${POSTGRES_DB:-medscribe}
      
      # API Keys
      GROQ_API_KEY: ${GROQ_API_KEY}
      HF_TOKEN: ${HF_TOKEN}
      
      # Models
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      GUARDRAIL_MODEL: ${GUARDRAIL_MODEL:-llama-3.1-8b-instant}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      
      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-8}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      
      # Physician Credentials
      DR_SHARMA_PASSWORD_HASH: ${DR_SHARMA_PASSWORD_HASH}
      DR_KUMAR_PASSWORD_HASH: ${DR_KUMAR_PASSWORD_HASH}
      DR_PATEL_PASSWORD_HASH: ${DR_PATEL_PASSWORD_HASH}
      
      # Application
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: ${DEBUG:-False}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      
      # File Uploads
      MAX_AUDIO_SIZE_MB: ${MAX_AUDIO_SIZE_MB:-50}
      MAX_PDF_SIZE_MB: ${MAX_PDF_SIZE_MB:-10}
      
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - backend_cache:/root/.cache
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - medscribe-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medscribe-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - medscribe-network
    restart: unless-stopped

  # Nginx Reverse Proxy (for HTTPS in production)
  nginx-proxy:
    image: nginx:alpine
    container_name: medscribe-nginx-proxy
    ports:
      - "443:443"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - medscribe-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  backend_cache:
    driver: local

networks:
  medscribe-network:
    driver: bridge

